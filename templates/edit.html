<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Task</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container py-5">

    <div class="card shadow-lg border-0 p-4">

        <h1 class="text-center mb-4">
            ✏️ Edit Task
        </h1>

        <form method="POST">

            <!-- Task Title -->
            <div class="mb-3">

                <label class="form-label">
                    Task Name
                </label>

                <input
                    type="text"
                    name="title"
                    class="form-control"
                    value="{{ task.title }}"
                    required
                >

            </div>

            <!-- Priority -->
            <div class="mb-3">

                <label class="form-label">
                    Priority
                </label>

                <select
                    name="priority"
                    class="form-select"
                >

                    <option value="High"
                        {% if task.priority == "High" %}
                        selected
                        {% endif %}
                    >
                        High
                    </option>

                    <option value="Medium"
                        {% if task.priority == "Medium" %}
                        selected
                        {% endif %}
                    >
                        Medium
                    </option>

                    <option value="Low"
                        {% if task.priority == "Low" %}
                        selected
                        {% endif %}
                    >
                        Low
                    </option>

                </select>

            </div>

            <!-- Category -->
            <div class="mb-3">

                <label class="form-label">
                    Category
                </label>

                <select
                    name="category"
                    class="form-select"
                >

                    <option value="Study"
                        {% if task.category == "Study" %}
                        selected
                        {% endif %}
                    >
                        Study
                    </option>

                    <option value="Work"
                        {% if task.category == "Work" %}
                        selected
                        {% endif %}
                    >
                        Work
                    </option>

                    <option value="Personal"
                        {% if task.category == "Personal" %}
                        selected
                        {% endif %}
                    >
                        Personal
                    </option>

                    <option value="Shopping"
                        {% if task.category == "Shopping" %}
                        selected
                        {% endif %}
                    >
                        Shopping
                    </option>

                </select>

            </div>

            <!-- Due Date -->
            <div class="mb-4">

                <label class="form-label">
                    Due Date
                </label>

                <input
                    type="date"
                    name="due_date"
                    class="form-control"
                    value="{{ task.due_date }}"
                >

            </div>

            <!-- Buttons -->
            <div class="d-flex gap-2">

                <button
                    type="submit"
                    class="btn btn-success"
                >
                    Update Task
                </button>

                <a
                    href="{{ url_for('index') }}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
